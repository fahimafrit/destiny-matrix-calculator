    <circle cx="514.1"  cy="479.62" r="14"/>
    <circle cx="332.59" cy="466"    r="10"/>
    <circle cx="375"    cy="424"    r="10"/>
    <circle cx="418.18" cy="380.69" r="10"/>
    <circle cx="461"    cy="338"    r="10"/>
    <circle cx="500"    cy="297"    r="10"/>
    <circle cx="127.11" cy="297"    r="12"/>
    <circle cx="333.7"  cy="90.62"  r="12"/>
    <circle cx="538.5"  cy="297"    r="12"/>
    <circle cx="333"    cy="505"    r="12"/>
    <circle cx="165.61" cy="297"    r="10"/>
    <circle cx="333.7"  cy="129"    r="10"/>
