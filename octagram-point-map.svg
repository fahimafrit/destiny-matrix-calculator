    <circle cx="479.79" cy="445.31" r="10"/>
    <circle cx="454.4"  cy="416.91" r="9"/>
  </g>

  <!-- Labels: font-size divided by scale so they render at intended size -->
  <g font-family="sans-serif" fill="#ffffff" text-anchor="middle" dominant-baseline="central">
    <g font-size="8.5">
      <text x="79.2"   y="297">a</text>
      <text x="333.7"  y="42">b</text>
