<!-- chart bottom at roughly y = 10 + 596*1.6 = 10 + 954 = 964 -->

<!-- ── DIVIDER ── -->
<line x1="30" y1="984" x2="1070" y2="984" stroke="#9c9a92" stroke-width="1.5"/>

<!-- ── NOTE ── -->
<text font-family="sans-serif" font-size="18" fill="#888" font-style="italic"
      x="30" y="1010">All values wrapped in reduceNumber(). Variable names end in "point" (e.g. j → jpoint). a, b, c = birth day / month / year (inputs).</text>

<!-- ── FORMULAS — 3 columns, row-height 36px, start y=1055 ── -->
<!-- col1 x=30  col2 x=400  col3 x=740 -->
<g font-family="monospace" font-size="22" fill="#26215C">

  <!-- COL 1 -->
  <text x="30"  y="1055">a  =  input (birth day)</text>
  <text x="30"  y="1091">b  =  input (birth month)</text>
  <text x="30"  y="1127">c  =  input (birth year)</text>
  <text x="30"  y="1163">d  =  a + b + c</text>
  <text x="30"  y="1199">e  =  a + b + c + d</text>
  <text x="30"  y="1235">f  =  a + b</text>
  <text x="30"  y="1271">f1 =  f + f2</text>
  <text x="30"  y="1307">f2 =  f + u</text>
  <text x="30"  y="1343">g  =  b + c</text>

  <!-- COL 2 -->
  <text x="400" y="1055">g1 =  g + g2</text>
  <text x="400" y="1091">g2 =  g + u</text>
  <text x="400" y="1127">h  =  d + a</text>
  <text x="400" y="1163">h1 =  h + h2</text>
  <text x="400" y="1199">h2 =  h + u</text>
  <text x="400" y="1235">i  =  c + d</text>
  <text x="400" y="1271">i1 =  i + i2</text>
  <text x="400" y="1307">i2 =  i + u</text>
  <text x="400" y="1343">j  =  d + e</text>

  <!-- COL 3 -->
  <text x="740" y="1055">k  =  j + l</text>
  <text x="740" y="1091">l  =  j + n</text>
  <text x="740" y="1127">m  =  l + n</text>
  <text x="740" y="1163">n  =  c + e</text>
  <text x="740" y="1199">o  =  a + s</text>
  <text x="740" y="1235">p  =  b + t</text>
  <text x="740" y="1271">q  =  n + c</text>
  <text x="740" y="1307">r  =  j + d</text>
  <text x="740" y="1343">s  =  a + e</text>

</g>

<!-- Row continuing after the 3-col block: t through x + purposes -->
<!-- These sit below y=1343+36=1379 but we need more height — extend viewBox -->
</svg>
