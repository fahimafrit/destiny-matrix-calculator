<svg width="100%" viewBox="0 0 1100 1400" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Destiny matrix octagram point map</title>
<desc>Circle labels show the JS variable prefix. Formulas listed alphabetically below.</desc>

<!-- ── OCTAGRAM scaled up ~1.6x and centered in 1100px width ── -->
<!-- Original chart: 680px wide, center ~334. Scale 1.6 → 1088px. Translate to center: (1100-1088)/2 = 6px -->
<g transform="translate(6,10) scale(1.6)">

  <g stroke="#9c9a92" stroke-width="1" fill="none" opacity="0.5">
    <rect x="163.63" y="126.14" width="340.16" height="340.16"/>
    <rect x="227.87" y="127.54" width="340.16" height="340.16" transform="translate(-158.13 367.16) rotate(-45)"/>
    <path d="M 315.22 15.42 Q 333.7 7.76 352.18 15.42
          L 519.16 84.62 Q 537.64 92.28 545.30 110.76
          L 614.51 277.74 Q 622.17 296.22 614.51 314.79
          L 545.30 482.59 Q 537.64 501.16 519.16 508.73
          L 352.18 577.11 Q 333.7 584.68 315.22 577.02
          L 148.24 507.82 Q 129.76 500.16 122.10 481.68
          L 52.90 314.70 Q 45.24 296.22 52.90 277.74
          L 122.10 110.76 Q 129.76 92.28 148.24 84.62 Z"/>
  </g>

  <g fill="#534AB7">
    <circle cx="79.2"   cy="297"    r="14"/>
    <circle cx="333.7"  cy="42"     r="14"/>
    <circle cx="587.13" cy="297"    r="14"/>
